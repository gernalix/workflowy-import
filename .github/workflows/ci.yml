name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: workflowy-import-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest -v test_workflowy_days.py
      - name: Compile Python
        run: python -m py_compile workflowy_days.py workflowy_job.py test_workflowy_days.py
